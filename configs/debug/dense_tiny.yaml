experiment:
  run_id: EXP-0001-dense-sanity
  description: Production-BPE dense baseline sanity run
  dataset_version: generated-tiny-corpus-v1
tokenizer:
  kind: bpe
  vocab_size: 300
  min_frequency: 2
data:
  sequence_length: 32
  batch_size: 4
  stride: 16
model:
  vocab_size: 300
  max_seq_len: 32
  d_model: 48
  num_layers: 2
  num_heads: 4
  num_kv_heads: 2
  d_ff: 128
  dropout: 0.0
  rope_base: 10000.0
  qk_norm: true
  tie_embeddings: true
optimizer:
  learning_rate: 0.003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  grad_clip: 1.0
scheduler:
  warmup_steps: 3
  total_steps: 40
  min_lr_ratio: 0.1
runtime:
  seed: 17
  device: cpu
  precision: fp32
  deterministic: true
  log_every: 1
  eval_every: 20
checkpoint:
  save_every: 20
  keep_last: 2
