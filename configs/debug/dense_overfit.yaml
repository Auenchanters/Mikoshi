experiment:
  run_id: EXP-0002-dense-overfit
  description: Deliberately tiny dense baseline overfit test
  dataset_version: repeated-pattern-v1
tokenizer:
  kind: bpe
  vocab_size: 300
  min_frequency: 2
data:
  sequence_length: 16
  batch_size: 4
  stride: 8
model:
  vocab_size: 300
  max_seq_len: 16
  d_model: 32
  num_layers: 2
  num_heads: 4
  num_kv_heads: 2
  d_ff: 96
  dropout: 0.0
  rope_base: 10000.0
  qk_norm: true
  tie_embeddings: true
optimizer:
  learning_rate: 0.005
  betas: [0.9, 0.95]
  weight_decay: 0.0
  grad_clip: 1.0
scheduler:
  warmup_steps: 2
  total_steps: 30
  min_lr_ratio: 0.2
runtime:
  seed: 23
  device: cpu
  precision: fp32
  deterministic: true
  log_every: 1
  eval_every: 15
checkpoint:
  save_every: 15
  keep_last: 2
